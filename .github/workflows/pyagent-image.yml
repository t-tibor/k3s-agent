name: PyAgent Image (arm64)

# Builds and pushes the KubernetesAiAgent.PyAgent container image for linux/arm64 (k3s target
# architecture) to GHCR, then retags k8s/kustomization.yaml to the pushed image and commits it back
# (GitOps). Modeled on t-tibor/shared-workflows' home-bot-shared-workflow.yml (QEMU + Buildx + GHCR
# login + kustomize-commit pattern), adapted for this repo's layout:
#   - build context is the PyAgent project dir, not the repo root (see the Dockerfile's own header
#     comment and k8s/README.md "Build the images")
#   - platform is linux/arm64 only, per this repo's k3s target — not multi-arch
#   - the manifest-update/commit step is skipped on tag pushes (HEAD is detached there, so there's no
#     branch to push the retag commit onto) — it still runs on master pushes and workflow_dispatch

on:
  push:
    branches: [master]
    tags: ["v*"]
    paths:
      - "src/backend/python/KubernetesAiAgent.PyAgent/**"
      - ".github/workflows/pyagent-image.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/pyagent
  CONTEXT: src/backend/python/KubernetesAiAgent.PyAgent

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set short SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=short
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.CONTEXT }}
          file: ${{ env.CONTEXT }}/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set up kustomize
        if: github.ref_type != 'tag'
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/

      - name: Update kustomize image tag
        if: github.ref_type != 'tag'
        working-directory: k8s
        run: |
          kustomize edit set image k3s-agent/kubernetes-agent=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.sha_short }}

      - name: Commit and push manifest
        if: github.ref_type != 'tag'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/kustomization.yaml
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "deploy: update pyagent image to ${{ steps.vars.outputs.sha_short }}"
          git push
