name: PyAgent Image (arm64)

# Builds and pushes the KubernetesAiAgent.PyAgent container image for linux/arm64 (k3s target
# architecture) to GHCR, for standalone use. PyAgent isn't part of the k8s/ deployment (see
# k8s/README.md, CLAUDE.md "Which agent runs") — netagent-image.yml owns k8s/kustomization.yaml — so this
# workflow only builds and pushes; it doesn't retag or commit any manifest.

on:
  push:
    branches: [master]
    tags: ["v*"]
    paths:
      - "python/KubernetesAiAgent.PyAgent/**"
      - ".github/workflows/pyagent-image.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/pyagent
  CONTEXT: python/KubernetesAiAgent.PyAgent

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=short,prefix=
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.CONTEXT }}
          file: ${{ env.CONTEXT }}/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
