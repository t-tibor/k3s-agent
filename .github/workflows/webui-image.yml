name: WebUI Image (arm64)

# Builds and pushes the frontend (src/frontend) container image for linux/arm64 (k3s target
# architecture) to GHCR, then retags k8s/kustomization.yaml to the pushed image and commits it back
# (GitOps). Mirrors pyagent-image.yml — see that workflow's header comment for the general shape;
# differences here:
#   - build context is the repo root, not the project dir, since src/frontend/Dockerfile needs to
#     COPY package.json/source from src/frontend but is invoked with that as its context already
#     (see the Dockerfile's own header comment) — CONTEXT is set to src/frontend to match
#   - VITE_AGENT_URL is a Vite build-time arg baked into the compiled bundle; left unset here so the
#     image keeps the code's own localhost:5192 fallback (see src/frontend/Dockerfile), consistent
#     with the port-forward workflow in k8s/README.md

on:
  push:
    branches: [master]
    tags: ["v*"]
    paths:
      - "src/frontend/**"
      - ".github/workflows/webui-image.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/webui
  CONTEXT: src/frontend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set short SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=short,prefix=
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.CONTEXT }}
          file: ${{ env.CONTEXT }}/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set up kustomize
        if: github.ref_type != 'tag'
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/

      - name: Update kustomize image tag
        if: github.ref_type != 'tag'
        working-directory: k8s
        run: |
          kustomize edit set image k3s-agent/webui=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.sha_short }}

      - name: Commit and push manifest
        if: github.ref_type != 'tag'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/kustomization.yaml
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "deploy: update webui image to ${{ steps.vars.outputs.sha_short }}"
          git push
