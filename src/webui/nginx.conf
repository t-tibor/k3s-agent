# Static single-page app: serve the Vite build output, falling back to index.html for client-side
# routing (this app doesn't currently do routing, but this is the standard safe default for an SPA).
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /healthz {
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
