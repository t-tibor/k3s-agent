# Template only — this ConfigMap is managed by hand directly in the cluster, not applied from this repo
# (it's deliberately not a kustomization.yaml resource and has no CI path). Copy this to
# agent-configmap.yaml (gitignored — see k8s/README.md), fill in your real MCP endpoint(s), and
# `kubectl apply -f k8s/agent-configmap.yaml` — or create/edit it imperatively with `kubectl edit
# configmap kubernetes-agent-config -n k3s-agent` so it never touches disk as a file at all.
#
# Mounted over the image's baked-in agentconfig.yaml (docs/ARCHITECTURE.md §10: "the whole thing can
# later be reloaded as a unit from a mounted Kubernetes ConfigMap"). The Deployment still needs a rollout
# to pick up ConfigMap changes — see k8s/README.md.
#
# No secrets belong in here — Agent:ModelConnection:ApiKey comes from the Secret referenced by
# agent-deployment.yaml instead.
apiVersion: v1
kind: ConfigMap
metadata:
  name: kubernetes-agent-config
  namespace: k3s-agent
data:
  agentconfig.yaml: |
    Agent:
      ModelId: kubernetes-agent
      ModelConnection:
        Model: deepseek/deepseek-v4-flash-0731
      McpServers:
        # TODO: point these at your already-deployed Kubernetes MCP server's in-cluster Service DNS name,
        # e.g. http://<service-name>.<namespace>.svc.cluster.local:<port>/mcp (docs/ARCHITECTURE.md §7.1,
        # §16). Add further entries (e.g. a Prometheus MCP server) the same way — each is connected to
        # independently and degrades gracefully if unreachable (§7.4).
        - Name: k8s-mcp
          Endpoint: "http://CHANGE-ME-k8s-mcp-service.CHANGE-ME-namespace.svc.cluster.local:8080/mcp"
