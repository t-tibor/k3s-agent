# Template only — do NOT fill in the real key and commit this file (docs/ARCHITECTURE.md §9.1,
# §20 design principle 9: no secrets in source control).
#
# Copy this to agent-secret.yaml (already .gitignore'd — see k8s/README.md), fill in the real key(s), and
# `kubectl apply -f k8s/agent-secret.yaml` — or, better, create it imperatively so it never touches disk
# as a file at all:
#
#   kubectl create secret generic kubernetes-agent-secrets \
#     --namespace k3s-agent \
#     --from-literal=openrouter-api-key='<your OpenRouter API key>' \
#     --from-literal=dashboard-otlp-api-key="$(openssl rand -hex 32)"
#
# dashboard-otlp-api-key authenticates OTLP telemetry sent from the kubernetes-agent container to the
# aspire-dashboard sidecar (agent-deployment.yaml) — any random high-entropy value works, it isn't a
# credential for anything external. The dashboard UI's own login (browser token) isn't a secret here at
# all — it's auto-generated per pod restart and read from the sidecar's logs, see k8s/README.md.
#
# For a GitOps-safe workflow, replace this with Sealed Secrets or an equivalent (docs/ARCHITECTURE.md §9.1)
# instead of applying plain Secret manifests.
apiVersion: v1
kind: Secret
metadata:
  name: kubernetes-agent-secrets
  namespace: k3s-agent
type: Opaque
stringData:
  openrouter-api-key: "CHANGE-ME"
  dashboard-otlp-api-key: "CHANGE-ME"
