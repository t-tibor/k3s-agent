# KubernetesAiAgent.NetAgent, built by dotnet/KubernetesAiAgent.NetAgent/Dockerfile (docs/ARCHITECTURE.md
# §16, §17). Serves both the built KubernetesAiAgent.WebUI SPA and the /agui API from this one pod/Service
# (§3.4) — there is no separate webui Deployment/Service.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubernetes-agent
  namespace: k3s-agent
  labels:
    app: kubernetes-agent
spec:
  replicas: 1 # stateless (docs/ARCHITECTURE.md §11, §20 design principle 8) — safe to scale up.
  selector:
    matchLabels:
      app: kubernetes-agent
  template:
    metadata:
      labels:
        app: kubernetes-agent
    spec:
      containers:
        - name: kubernetes-agent
          image: k3s-agent/kubernetes-agent:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: Agent__ModelConnection__ApiKey
              valueFrom:
                secretKeyRef:
                  name: kubernetes-agent-secrets
                  key: openrouter-api-key
          volumeMounts:
            - name: config
              mountPath: /app/agentconfig.yaml
              subPath: agentconfig.yaml
              readOnly: true
            - name: tmp
              mountPath: /tmp
          # NetAgent only registers /health and /alive when ASPNETCORE_ENVIRONMENT=Development (Aspire
          # ServiceDefaults gate — see KubernetesAiAgent.ServiceDefaults/Extensions.cs), which is
          # deliberately not set here since this is a production deployment. A TCP check on the agent's
          # port is the closest equivalent without adopting that gate for a real deployment.
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: config
          configMap:
            name: kubernetes-agent-config
        - name: tmp
          emptyDir: {}
