[project]
name = "kubernetes-ai-agent-py"
version = "0.1.0"
description = "Kubernetes AI Agent backend — Python port on Microsoft Agent Framework (AG-UI only)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "agent-framework-ag-ui>=1.2.1,<2",
    "agent-framework-openai>=1.14.1",
    "mcp>=1.0,<2",
    "opentelemetry-exporter-otlp>=1.29",
    "opentelemetry-instrumentation-fastapi>=0.50b0",
    "opentelemetry-instrumentation-httpx>=0.50b0",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Tests live outside this uv project (../../tests/python — see CLAUDE.md repository layout) so the
# same test suite can sit alongside the .NET tests under the repo's top-level tests/ directory.
testpaths = ["../../tests/python"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kubernetes_agent"]
